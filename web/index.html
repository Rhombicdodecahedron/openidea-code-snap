<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Snap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="controls">
    <div class="row">
      <label class="field">Theme <select id="theme"></select></label>
      <label class="field">Background <select id="bg"></select></label>
      <label class="field">Padding
        <select id="pad">
          <option value="24">Small</option>
          <option value="56">Medium</option>
          <option value="88">Large</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="chrome"> Window</label>
      <label class="check"><input type="checkbox" id="numbers"> Line numbers</label>
      <input id="title" class="title" placeholder="Title" spellcheck="false" aria-label="Title">
    </div>
    <div class="row actions">
      <button id="save" type="button">Save PNG…</button>
      <button id="copy" type="button" class="primary">Copy image</button>
    </div>
  </header>

  <main id="stage" class="stage">
    <canvas id="preview" aria-label="Preview of the image"></canvas>
  </main>

  <footer id="status" class="status" role="status"></footer>

  <script src="vendor/highlight.min.js"></script>
  <script src="snap.js"></script>
</body>
</html>
